name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test (gate the release)
        run: |
          dotnet test LaunchFast.slnx --logger "trx;LogFileName=results.trx" --results-directory TestResults || {
            echo "::warning::test attempt 1 failed — annotating then retrying once (the release gate tolerates a single flaky run; ci stays the honest no-retry gate)";
            python3 .github/scripts/annotate_trx.py || true;
            rm -rf TestResults;
            dotnet test LaunchFast.slnx;
          }

      - name: Build .app + zip
        run: build/macos/make-app.sh "${{ steps.ver.outputs.version }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: LaunchFast-*-osx-arm64.zip
